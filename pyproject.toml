[project]
name = "oop_in_python"
version = "1.0"
dependencies = [
    "nbformat",
    "numpy",
    "opencv-python",
    "PyQt6",
]

[tool.pyright]
ignore = [
    "demo/oopDemo.py",
    "demo/oopDemo-b.py",
]

[tool.ruff]
preview = true
line-length = 100
exclude = [
    "demo/oopDemo.py",
    "demo/oopDemo-b.py",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.uv]
package = false
